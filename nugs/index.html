<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>3D Nugs — Autoplay When Idle</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
  }

  #viewer {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    position: relative;
    overflow: hidden;
  }

  #image {
    width: 100%;
    height: auto;
    max-height: 100%;
    object-fit: contain;
    display: block;
    cursor: pointer;
  }

  #slider {
    position: relative;
    z-index: 2;
    width: 30vw;
    margin: 20px 0;
    -webkit-appearance: none;
    appearance: none;
    height: 8px;
    background: #333;
    border-radius: 4px;
    outline: none;
    pointer-events: none;
    cursor: default;
  }
  #slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 5px rgba(255,255,255,0.8);
  }
  #slider::-moz-range-thumb {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 5px rgba(255,255,255,0.8);
  }

  #loadingOverlay {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 1.2em;
    z-index: 999;
  }
</style>
</head>
<body>

  <div id="viewer">
    <img id="image" src="3d scan jpg/frame-07.jpg" alt="3D object frame" />
  </div>

  <input type="range" id="slider" min="1" max="36" step="1" value="7" aria-hidden="true" tabindex="-1">

  <div id="loadingOverlay">Loading 3D Object...</div>

<script>
  const TOTAL_FRAMES = 36;
  const FOLDER = "3d scan jpg";
  const START_FRAME = 7;
  const SCRUB_WIDTH = 0.75;

  const img = document.getElementById('image');
  const slider = document.getElementById('slider');
  const loadingOverlay = document.getElementById('loadingOverlay');

  let frames = [];
  let loadedCount = 0;

  for (let i = 1; i <= TOTAL_FRAMES; i++) {
    const frame = new Image();
    frame.src = `${FOLDER}/frame-${String(i).padStart(2,'0')}.jpg`;
    frame.onload = () => {
      loadedCount++;
      loadingOverlay.textContent = `Loading ${Math.round((loadedCount / TOTAL_FRAMES) * 100)}%`;
      if (loadedCount === TOTAL_FRAMES) loadingOverlay.style.display = 'none';
    };
    frames[i] = frame;
  }

  function sliderToImageIndex(sliderValue) {
    return TOTAL_FRAMES - sliderValue + 1;
  }

  let currentImageIndex = sliderToImageIndex(START_FRAME);

  function showImageByIndex(idx) {
    img.src = frames[idx].src;
  }
  showImageByIndex(currentImageIndex);
  slider.value = START_FRAME;

  function setFrameFromSliderValue(sliderValue) {
    const imageIndex = sliderToImageIndex(sliderValue);
    if (imageIndex !== currentImageIndex) {
      currentImageIndex = imageIndex;
      showImageByIndex(currentImageIndex);
    }
  }

  function getSliderValueFromClientX(clientX) {
    const rect = img.getBoundingClientRect();
    const scrubWidth = rect.width * SCRUB_WIDTH;
    const scrubStart = rect.left + (rect.width - scrubWidth) / 2;
    let ratio = (clientX - scrubStart) / scrubWidth;
    ratio = Math.min(Math.max(ratio, 0), 1);
    return Math.round(ratio * (TOTAL_FRAMES - 1)) + 1;
  }

  // Mouse scrub
  img.addEventListener('mousemove', e => {
    stopAutoplay();
    const sliderValue = getSliderValueFromClientX(e.clientX);
    slider.value = sliderValue;
    setFrameFromSliderValue(sliderValue);
  });

  // Touch scrub
  img.addEventListener('touchstart', e => {
    stopAutoplay();
    const sliderValue = getSliderValueFromClientX(e.touches[0].clientX);
    slider.value = sliderValue;
    setFrameFromSliderValue(sliderValue);
    e.preventDefault();
  }, { passive: false });
  img.addEventListener('touchmove', e => {
    stopAutoplay();
    const sliderValue = getSliderValueFromClientX(e.touches[0].clientX);
    slider.value = sliderValue;
    setFrameFromSliderValue(sliderValue);
    e.preventDefault();
  }, { passive: false });

  // Keyboard arrows
  window.addEventListener('keydown', e => {
    stopAutoplay();
    if (e.key === 'ArrowRight') {
      let v = Math.min(Number(slider.value) + 1, TOTAL_FRAMES);
      slider.value = v;
      setFrameFromSliderValue(v);
    } else if (e.key === 'ArrowLeft') {
      let v = Math.max(Number(slider.value) - 1, 1);
      slider.value = v;
      setFrameFromSliderValue(v);
    }
  });

  // --- AUTOPLAY ---
  let autoplayInterval = null;

  function startAutoplay() {
    if (autoplayInterval) return;
    autoplayInterval = setInterval(() => {
      let v = Number(slider.value) + 1;
      if (v > TOTAL_FRAMES) v = 1;
      slider.value = v;
      setFrameFromSliderValue(v);
    }, 65); // speed: change frame every 100ms
  }

  function stopAutoplay() {
    if (autoplayInterval) {
      clearInterval(autoplayInterval);
      autoplayInterval = null;
    }
  }

  // Start autoplay when mouse leaves the image
  img.addEventListener('mouseleave', startAutoplay);
  // Stop autoplay when mouse re-enters
  img.addEventListener('mouseenter', stopAutoplay);

  // On touch devices: start autoplay when no touches
  img.addEventListener('touchend', () => {
    if (!autoplayInterval) startAutoplay();
  });

  // Kick off autoplay initially (optional)
  startAutoplay();
</script>
</body>
</html>
