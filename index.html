    <style>
        /* ---------- MASONRY GRID ---------- */
        .masonry {
            padding: 40px 40px 0 40px;
            column-count: 4;
            column-gap: 40px;
        }

        .masonry-item {
            position: relative;
            break-inside: avoid;
            margin-bottom: 20px;
            width: 100%;
        }

        .masonry-item img,
        .masonry-item video {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* ---------- OVERLAY ---------- */
        .masonry-item .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            pointer-events: all;
        }

        /* ---------- RESPONSIVE GRID ---------- */
        @media (max-width: 1200px) {
            .masonry {
                column-count: 4;
            }
        }

        @media (max-width: 800px) {
            .masonry {
                column-count: 3;
                padding: 30px;
            }
        }

        @media (max-width: 480px) {
            .masonry {
                column-count: 2;
            }
        }

        /* ---------- TRANSPARENT LOADING SCREEN ---------- */
        #page-loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.47);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            opacity: 1;
            visibility: visible;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        /* Random-photo slideshow behind the loading overlay */
        #loader-slideshow {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .loader-photo {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            max-width: none;
            object-fit: cover;
            object-position: center;
            opacity: 0;
            transition: opacity 0.12s linear;
        }

        .loader-photo.active {
            opacity: 0.38;
        }

        #page-loader.is-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .loader-logo {
            font-family: inherit;
            font-size: 28px;
            font-weight: 500;
            letter-spacing: -1px;
            color: #222;
        }

        .loader-spinner {
            width: 24px;
            height: 24px;
            border: 2px solid rgba(0, 0, 0, 0.12);
            border-top-color: #222;
            border-radius: 50%;
            animation: loader-spin 0.8s linear infinite;
        }

        .loader-text {
            font-family: inherit;
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: lowercase;
            color: #555;
        }

        @keyframes loader-spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .loader-spinner {
                animation-duration: 2s;
            }

            #page-loader {
                transition-duration: 0.1s;
            }

            .loader-photo {
                transition-duration: 0.3s;
            }
        }

        /* ---------- LIGHTBOX ---------- */
        #lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        #lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        #lightbox video {
            max-width: 90%;
            max-height: 90%;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        #lightbox .close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 36px;
            color: white;
            cursor: pointer;
            font-family: sans-serif;
        }

        /* ---------- STATIC HERO IMAGE + ARIZONIA TITLE ---------- */
        .featured-image {
            position: relative;
            width: 100%;
            height: 65vh;
            min-height: 350px;
            margin: 80px 0 10px;
            overflow: hidden;
            isolation: isolate;
            background: #000;
        }

        .featured-track {
            display: block;
            width: 100%;
            height: 100%;
            animation: none;
            transform: none;
        }

        .featured-slide {
            display: none;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .featured-slide:first-child {
            display: block;
            width: 100%;
            height: 100%;
        }

        .featured-image img {
            display: block;
            width: 100%;
            height: 100%;
            max-width: none;
            object-fit: contain;
            object-position: center;
        }

        .featured-image > .overlay {
            position: absolute;
            inset: 0;
            z-index: 2;
            background: rgba(0, 0, 0, 0.10);
            pointer-events: none;
        }

        .featured-title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            width: 90%;
            margin: 0;
            text-align: center;
            font-family: 'Arizonia', cursive;
            font-size: clamp(48px, 8vw, 110px);
            font-weight: 400;
            line-height: 1.1;
            letter-spacing: 0;
            color: #ffffff;
            text-shadow: 0 2px 18px rgba(0, 0, 0, 0.45);
            pointer-events: none;
        }

        @media (max-width: 1023px) {

                height: 45vh;

        }

            .featured-title {
                width: 92%;
                font-size: clamp(42px, 12vw, 68px);
                line-height: 1.1;
            }
        }
    </style>
</head>

    <script>
        function showContactPreview() {
            alert("Email: sewlie.art@gmail.com");
        }

        const masonry = document.getElementById("masonry");
        let images = masonry.querySelectorAll("img, video");
        let overlays = masonry.querySelectorAll(".overlay");

        // ---------- SHUFFLE MASONRY ITEMS ----------
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }

            return array;
        }

        // ---------- LIGHTBOX ----------
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = lightbox.querySelector("img");
        const closeBtn = lightbox.querySelector(".close");

        function setupOverlays() {
            images = masonry.querySelectorAll("img, video");
            overlays = masonry.querySelectorAll(".overlay");

            overlays.forEach((overlay, index) => {
                overlay.addEventListener("click", () => {
                    const media = images[index];

                    if (media.tagName === "VIDEO") {
                        const videoSrc =
                            media.querySelector("source")?.src || media.src;

                        const video = document.createElement("video");
                        video.src = videoSrc;
                        video.controls = true;
                        video.autoplay = true;
                        video.muted = true;
                        video.loop = true;
                        video.playsInline = true;
                        video.style.maxWidth = "90%";
                        video.style.maxHeight = "90%";

                        lightboxImg.style.display = "none";

                        const existingVideo = lightbox.querySelector("video");

                        if (existingVideo) {
                            existingVideo.pause();
                            existingVideo.remove();
                        }

                        lightbox.appendChild(video);
                        lightbox.style.display = "flex";

                        video.play().catch(() => {});
                    } else {
                        const existingVideo = lightbox.querySelector("video");

                        if (existingVideo) {
                            existingVideo.pause();
                            existingVideo.remove();
                        }

                        lightboxImg.style.display = "block";
                        lightboxImg.src = media.src;
                        lightboxImg.alt = media.alt;
                        lightbox.style.display = "flex";
                    }
                });

                overlay.addEventListener("contextmenu", event => {
                    event.preventDefault();
                    alert("Right-click is disabled on these images");
                });
            });
        }

        function closeLightbox() {
            lightbox.style.display = "none";

            const video = lightbox.querySelector("video");

            if (video) {
                video.pause();
                video.remove();
            }

            lightboxImg.src = "";
            lightboxImg.style.display = "block";
        }

        closeBtn.addEventListener("click", closeLightbox);

        lightbox.addEventListener("click", event => {
            if (event.target === lightbox) {
                closeLightbox();
            }
        });

        document.addEventListener("keydown", event => {
            if (event.key === "Escape") {
                closeLightbox();
            }
        });

        // ---------- PREVENT DRAGGING ----------
        images.forEach(media => {
            media.setAttribute("draggable", "false");
        });

        // ---------- INITIALIZE ----------
        document.addEventListener("DOMContentLoaded", () => {
            window.scrollTo({ top: 0, behavior: "instant" });

            const items = shuffle(Array.from(masonry.children));

            items.forEach(item => masonry.appendChild(item));

            setupOverlays();
        });
    </script>

    <!-- LOADING DETECTION + RANDOM PHOTO SLIDESHOW -->
    <script>
        (() => {
            const loader = document.getElementById("page-loader");

            // ---------- RANDOM PHOTO SLIDESHOW ----------
            const photoA = document.getElementById("loader-photo-a");
            const photoB = document.getElementById("loader-photo-b");

            const galleryPhotos = Array.from(
                document.querySelectorAll("#masonry img")
            )
                .map(img => img.getAttribute("src"))
                .filter(Boolean);

            const uniquePhotos = [...new Set(galleryPhotos)];

            let currentPhoto = -1;
            let activePhoto = photoA;
            let inactivePhoto = photoB;
            let slideshowInterval = null;

            function getRandomPhoto() {
                if (uniquePhotos.length === 0) {
                    return null;
                }

                if (uniquePhotos.length === 1) {
                    return uniquePhotos[0];
                }

                let nextPhoto;

                do {
                    nextPhoto = Math.floor(
                        Math.random() * uniquePhotos.length
                    );
                } while (nextPhoto === currentPhoto);

                currentPhoto = nextPhoto;

                return uniquePhotos[currentPhoto];
            }

            function showNextLoaderPhoto() {
                const nextSrc = getRandomPhoto();

                if (!nextSrc || !inactivePhoto) {
                    return;
                }

                inactivePhoto.onload = () => {
                    inactivePhoto.classList.add("active");
                    activePhoto.classList.remove("active");

                    const previousPhoto = activePhoto;

                    activePhoto = inactivePhoto;
                    inactivePhoto = previousPhoto;

                    inactivePhoto.onload = null;
                    inactivePhoto.onerror = null;
                };

                inactivePhoto.onerror = () => {
                    inactivePhoto.onload = null;
                    inactivePhoto.onerror = null;
                };

                inactivePhoto.src = nextSrc;
            }

            // Show the first random photo immediately.
            if (uniquePhotos.length > 0) {
                currentPhoto = Math.floor(
                    Math.random() * uniquePhotos.length
                );

                photoA.src = uniquePhotos[currentPhoto];
                photoA.classList.add("active");

                // Change to a different random photo every 180 milliseconds.
                slideshowInterval = setInterval(
                    showNextLoaderPhoto,
                    180
                );
            }

            // ---------- WAIT FOR PAGE MEDIA ----------
            const media = Array.from(
                document.querySelectorAll("#masonry img, #masonry video")
            );

            let finished = false;

            function hideLoader() {
                if (finished) {
                    return;
                }

                finished = true;

                clearInterval(slideshowInterval);

                loader.classList.add("is-hidden");

                setTimeout(() => {
                    loader.remove();
                }, 700);
            }

            function waitForMedia(element) {
                return new Promise(resolve => {
                    let settled = false;
                    let timeout;

                    function finish() {
                        if (settled) {
                            return;
                        }

                        settled = true;

                        clearTimeout(timeout);

                        element.removeEventListener("load", finish);
                        element.removeEventListener("error", finish);
                        element.removeEventListener("loadeddata", finish);
                        element.removeEventListener("canplay", finish);

                        resolve();
                    }

                    // Don't let a missing file keep the loader on forever.
                    timeout = setTimeout(finish, 15000);

                    if (element.tagName === "IMG") {
                        if (element.complete) {
                            finish();
                        } else {
                            element.addEventListener(
                                "load",
                                finish,
                                { once: true }
                            );

                            element.addEventListener(
                                "error",
                                finish,
                                { once: true }
                            );
                        }
                    } else {
                        if (element.readyState >= 2) {
                            finish();
                        } else {
                            element.addEventListener(
                                "loadeddata",
                                finish,
                                { once: true }
                            );

                            element.addEventListener(
                                "canplay",
                                finish,
                                { once: true }
                            );

                            element.addEventListener(
                                "error",
                                finish,
                                { once: true }
                            );
                        }

                        element.load();
                    }
                });
            }

            const pageReady = document.readyState === "complete"
                ? Promise.resolve()
                : new Promise(resolve => {
                    window.addEventListener(
                        "load",
                        resolve,
                        { once: true }
                    );
                });

            // Safety fallback if something takes too long to load.
            const safetyTimeout = setTimeout(hideLoader, 15000);

            Promise.all([
                pageReady,
                ...media.map(waitForMedia)
            ]).then(() => {
                clearTimeout(safetyTimeout);
                hideLoader();
            });
        })();
    </script>

</body>
</html>
