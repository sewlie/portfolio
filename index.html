    <style>
        /* Lightbox magnifier */
        #lightbox .close { z-index: 2; }
        #zoom-lens {
            display: none;
            position: fixed;
            z-index: 3;
            pointer-events: none;
            background-repeat: no-repeat;
            background-color: #000;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9), 0 10px 30px rgba(0, 0, 0, 0.55);
        }
        #zoom-lens.lens-circle { border-radius: 50%; }
        #zoom-lens.lens-square { border-radius: 6px; }

        /* Navbar layers (plants are z-index 5 to 99 depending on screen width):
           black bar = under the plants, nav words = above the plants */
        :root { --nav-h: 78px; }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--nav-h);
            background: #000000;
            box-shadow: 0 4px 10px -6px rgba(255, 255, 255, 0.077);
            z-index: 2;
            pointer-events: none;
        }

        .menu {
            z-index: 100;
            height: var(--nav-h);
            background-color: transparent;
            box-shadow: none;
        }

        /* Side plants slide off-screen as you scroll */
        .side-plant {
            will-change: translate;
        }
        .side-plant-left {
            translate: calc(var(--plant-hide, 0) * -150%) 0;
        }
        .side-plant-right {
            translate: calc(var(--plant-hide, 0) * 150%) 0;
        }

        /* Hide the plants on portrait / tall screens (vertical tablets) and narrow screens */
        @media (max-aspect-ratio: 1/1), (max-width: 1023px) {
            .side-plants {
                display: none;
            }
        }
    </style>
</head>

        }

        const masonry = document.getElementById("masonry");

        let images = masonry.querySelectorAll("img, video");
        let overlays = masonry.querySelectorAll(".overlay");


        // ---------- SHUFFLE MASONRY ITEMS ----------

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }

            return array;
        }


        // ---------- LIGHTBOX ----------

        const lightbox = document.getElementById("lightbox");
        const lightboxImg = lightbox.querySelector("img");
        const closeBtn = lightbox.querySelector(".close");


        function setupOverlays() {

            images = masonry.querySelectorAll("img, video");
            overlays = masonry.querySelectorAll(".overlay");

            overlays.forEach((overlay, index) => {

                overlay.addEventListener("click", () => {

                    const media = images[index];

                    if (media.tagName === "VIDEO") {

                        const videoSrc =
                            media.querySelector("source")?.src || media.src;

                        const video = document.createElement("video");

                        video.src = videoSrc;
                        video.controls = true;
                        video.autoplay = true;
                        video.muted = true;
                        video.loop = true;
                        video.playsInline = true;
                        video.style.maxWidth = "90%";
                        video.style.maxHeight = "90%";

                        lightboxImg.style.display = "none";

                        const existingVideo = lightbox.querySelector("video");

                        if (existingVideo) {
                            existingVideo.pause();
                            existingVideo.remove();
                        }

                        lightbox.appendChild(video);
                        lightbox.style.display = "flex";

                        video.play().catch(() => {});

                    } else {

                        const existingVideo = lightbox.querySelector("video");

                        if (existingVideo) {
                            existingVideo.pause();
                            existingVideo.remove();
                        }

                        lightboxImg.style.display = "block";

                        // Use the large version in the lightbox, fall back to the grid image
                        exitZoom();
                        lightboxImg.src = media.dataset.full || media.src;
                        lightboxImg.alt = media.alt;

                        lightbox.style.display = "flex";

                    }

                });


                overlay.addEventListener("contextmenu", e => {

                    e.preventDefault();

                    alert("Right-click is disabled on these images");

                });

            });

        }


        function closeLightbox() {

            lightbox.style.display = "none";

            const video = lightbox.querySelector("video");

            if (video) {
                video.pause();
                video.remove();
            }

            exitZoom();
            lightboxImg.src = "";
            lightboxImg.style.display = "block";

        }


        // ---------- LIGHTBOX MAGNIFIER (a lens follows the mouse, the photo stays still) ----------

        const LENS_SHAPE = "circle";   // "circle" or "square"
        const LENS_SIZE = 450;         // lens width/height in pixels
        const MIN_ZOOM = 3;            // weakest magnification
        const MAX_ZOOM = 3;            // strongest magnification

        const lens = document.createElement("div");
        lens.id = "zoom-lens";
        lens.className = LENS_SHAPE === "square" ? "lens-square" : "lens-circle";
        lens.style.width = lens.style.height = LENS_SIZE + "px";
        lightbox.appendChild(lens);

        function exitZoom() {

            lens.style.display = "none";
            lightbox.style.cursor = "";

        }

        function zoomAt(e) {

            // Magnifier is for mouse/trackpad; touch screens keep the normal view
            if (e.pointerType === "touch") return;

            // Only for photos that have fully loaded (not videos)
            if (lightboxImg.style.display === "none") return exitZoom();
            if (!lightboxImg.complete || !lightboxImg.naturalWidth) return exitZoom();

            const r = lightboxImg.getBoundingClientRect();

            const inside =
                e.clientX >= r.left && e.clientX <= r.right &&
                e.clientY >= r.top && e.clientY <= r.bottom;

            if (!inside) return exitZoom();

            // Magnify toward the photo's real pixel size
            const zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, lightboxImg.naturalWidth / r.width));

            const x = e.clientX - r.left;
            const y = e.clientY - r.top;

            lens.style.backgroundImage = `url("${lightboxImg.currentSrc || lightboxImg.src}")`;
            lens.style.backgroundSize = `${r.width * zoom}px ${r.height * zoom}px`;
            lens.style.backgroundPosition = `${-(x * zoom - LENS_SIZE / 2)}px ${-(y * zoom - LENS_SIZE / 2)}px`;

            lens.style.left = (e.clientX - LENS_SIZE / 2) + "px";
            lens.style.top = (e.clientY - LENS_SIZE / 2) + "px";
            lens.style.display = "block";

            lightbox.style.cursor = "none";

        }

        lightbox.addEventListener("pointermove", zoomAt);
        lightbox.addEventListener("pointerleave", exitZoom);
        window.addEventListener("resize", exitZoom);


        closeBtn.addEventListener("click", closeLightbox);


        lightbox.addEventListener("click", e => {

            if (e.target === lightbox) {
                closeLightbox();
            }

        });


        document.addEventListener("keydown", e => {

            if (e.key === "Escape") {
                closeLightbox();
            }

        });


        // ---------- IMAGE LOAD FIX ----------

        images.forEach(media => {
            media.setAttribute("draggable", "false");
        });


        // ---------- SIDE PLANTS: slide away on scroll ----------

        const HIDE_DISTANCE = 300;   // pixels of scrolling until the plants are fully hidden
        const sidePlants = document.querySelector(".side-plants");

        let plantTicking = false;

        function updatePlants() {

            const progress = Math.min(1, Math.max(0, window.scrollY / HIDE_DISTANCE));
            sidePlants.style.setProperty("--plant-hide", progress);
            plantTicking = false;

        }

        window.addEventListener("scroll", () => {

            if (!plantTicking) {
                requestAnimationFrame(updatePlants);
                plantTicking = true;
            }

        }, { passive: true });

        updatePlants();


        // ---------- INITIALIZE ----------

        document.addEventListener("DOMContentLoaded", () => {

            window.scrollTo({ top: 0, behavior: "instant" });

            const items = shuffle(Array.from(masonry.children));

            items.forEach(item => masonry.appendChild(item));

            setupOverlays();

            // Play grid videos only while they are on (or near) the screen
            const videoObserver = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.play().catch(() => {});
                    } else {
                        entry.target.pause();
                    }
                });
            }, { rootMargin: "200px" });

            masonry.querySelectorAll("video").forEach(v => videoObserver.observe(v));

        });

    </script>


    <!-- LOADING SCREEN: hides as soon as the page itself has loaded -->
    <script>

        (() => {

            const loader = document.getElementById("page-loader");

            function hideLoader() {

                if (!loader || loader.dataset.done) return;

                loader.dataset.done = "1";

                loader.classList.add("is-hidden");

                setTimeout(() => loader.remove(), 700);

            }

            if (document.readyState === "complete") {
                hideLoader();
            } else {
                window.addEventListener("load", hideLoader, { once: true });
            }

            // Safety net in case something stalls
            setTimeout(hideLoader, 4000);

        })();

    </script>
