    <style>
        /* ---------- MASONRY GRID ---------- */
        .masonry {
            padding: 40px;
            column-count: 3;
            column-gap: 20px;
        }

        .masonry-item {
            position: relative;
            break-inside: avoid;
            margin-bottom: 20px;
            width: 100%;
        }

        .masonry-item img {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        .masonry-item video {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* ---------- OVERLAY ---------- */
        .masonry-item .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            pointer-events: all;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 1200px) {
            .masonry {
                column-count: 3;
            }
        }

        @media (max-width: 800px) {
            .masonry {
                column-count: 2;
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            .masonry {
                column-count: 1;
            }
        }

        /* ---------- LIGHTBOX ---------- */
        #lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        #lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        #lightbox video {
            max-width: 90%;
            max-height: 90%;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        #lightbox .close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 36px;
            color: white;
            cursor: pointer;

    <!-- SCRIPT -->
    <script>
        function showContactPreview() {
            alert("Email: sewlie.art@gmail.com");
        }

        const masonry = document.getElementById("masonry");
        let images = masonry.querySelectorAll("img, video");
        let overlays = masonry.querySelectorAll(".overlay");

        // ---------- RANDOMIZE MASONRY ITEMS & SCROLL TO TOP ----------
        document.addEventListener("DOMContentLoaded", function() {
            // Scroll to top on refresh
            window.scrollTo({ top: 0, behavior: "smooth" });

            // Shuffle masonry items
            let itemsArray = Array.from(masonry.children);
            itemsArray = shuffle(itemsArray);
            itemsArray.forEach(item => masonry.appendChild(item));

            // Refresh NodeLists after shuffle
            images = masonry.querySelectorAll("img, video");
            overlays = masonry.querySelectorAll(".overlay");

            // Setup overlays for lightbox
            setupOverlays();
        });

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // ---------- IMAGE LOAD FIX ----------
        let loaded = 0;

        images.forEach(img => {
            img.setAttribute("draggable", "false");

            if (img.complete) {
                loaded++;
            } else {
                img.addEventListener("load", () => {
                    loaded++;

                    if (loaded === images.length) {
                        masonry.style.columnGap = "21px";

                        setTimeout(() => {
                            masonry.style.columnGap = "20px";
                        }, 50);
                    }
                });
            }
        });

        // ---------- LIGHTBOX FUNCTIONALITY ----------
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = lightbox.querySelector("img");
        const closeBtn = lightbox.querySelector(".close");

        function setupOverlays() {
            overlays.forEach((overlay, index) => {
                overlay.addEventListener("click", () => {
                    const media = images[index];

                    if (media.tagName === "VIDEO") {
                        // Open video in a temporary image-compatible lightbox source.
                        const videoSrc = media.querySelector("source")?.src || media.src;

                        const video = document.createElement("video");
                        video.src = videoSrc;
                        video.controls = true;
                        video.autoplay = true;
                        video.muted = true;
                        video.loop = true;
                        video.playsInline = true;
                        video.style.maxWidth = "90%";
                        video.style.maxHeight = "90%";

                        lightboxImg.style.display = "none";

                        const existingVideo = lightbox.querySelector("video");
                        if (existingVideo) {
                            existingVideo.remove();
                        }

                        lightbox.appendChild(video);
                        lightbox.style.display = "flex";
                        video.play().catch(() => {});
                    } else {
                        const existingVideo = lightbox.querySelector("video");
                        if (existingVideo) {
                            existingVideo.pause();
                            existingVideo.remove();
                        }

                        lightboxImg.style.display = "block";
                        lightboxImg.src = media.src;
                        lightboxImg.alt = media.alt;
                        lightbox.style.display = "flex";
                    }
                });

                overlay.addEventListener("contextmenu", e => {
                    e.preventDefault();
                    alert("Right-click is disabled on these images");
                });
            });
        }

        function closeLightbox() {
            lightbox.style.display = "none";

            const video = lightbox.querySelector("video");
            if (video) {
                video.pause();
                video.remove();
            }

            lightboxImg.src = "";
            lightboxImg.style.display = "block";
        }

        closeBtn.addEventListener("click", closeLightbox);

        lightbox.addEventListener("click", e => {
            if (e.target === lightbox) {
                closeLightbox();
            }
        });

        document.addEventListener("keydown", e => {
            if (e.key === "Escape") {
                closeLightbox();
            }
        });
    </script>
