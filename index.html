<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sewlie</title>

    <link rel="stylesheet" href="/stylesheets/style.css">
    <link rel="stylesheet" href="/stylesheets/navbar.css">

    <style>
        body {
            margin: 0;
            background: #ffffff;
            color: #000000;
            font-family: Arial, Helvetica, sans-serif;
        }

        nav.menu {
            background: transparent;
        }

        nav.menu a {
            color: #000;
            text-decoration: none;
        }

        .homepage-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 120px 40px 80px;
            display: flex;
            flex-direction: column;
            gap: 80px;
            text-align: left;
        }

        .entry-block {
            padding-bottom: 10px;
            border-bottom: 1px solid transparent;
            transition: opacity 0.2s ease, border-color 0.2s ease;
            cursor: pointer;
        }

        .entry-block:hover {
            opacity: 0.5;
            border-color: #c0c0c0;
        }

        .entry-title {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 0em;
            margin-bottom: 12px;
        }

        .entry-description {
            font-size: 1rem;
            max-width: 520px;
            line-height: 1.5;
            color: #333;
        }

        .footer-note {
            margin-top: 120px;
            font-size: 0.85rem;
            text-align: center;
            color: #777;
        }

        @media (max-width: 600px) {
            .homepage-container {
                padding: 100px 24px 60px;
                gap: 60px;
            }

            .entry-title {
                font-size: 2.4rem;
            }
        }
    </style>
</head>

<body>

    <nav class="menu">
        <div class="menu-left">
            <a href="/">sewlie</a>
        </div>

        <div class="menu-center">
            <a href="#" onclick="event.preventDefault(); showContactPreview()">contact</a>
        </div>
    </nav>

    <main class="homepage-container">

        <div class="entry-block" onclick="window.location.href='/design'">
            <div class="entry-title">DESIGN</div>
            <div class="entry-description">
                Visual systems, posters, physical objects, and digital work
            </div>
        </div>

        <div class="entry-block" onclick="window.location.href='/photography'">
            <div class="entry-title">PHOTOGRAPHY</div>
            <div class="entry-description">
                Macro cannabis photography and close-range visual studies
            </div>
        </div>

        <div class="footer-note">
            Based in NYC • Available for commissions
        </div>

    </main>

    <div class="preview-overlay" id="contact-preview" onclick="hideContactPreview(event)" style="
        display:none;
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        background:rgba(255,255,255,0.95);
        justify-content:center;
        align-items:center;
        z-index:10;
    ">
        <div class="contact-preview" style="
            border-radius:10px;
            padding:30px 40px;
            background:#fff;
            box-shadow:0 0 20px rgba(0,0,0,0.15);
            opacity:0;
            transition:opacity 0.2s ease;
        ">
            <p style="font-weight:700; margin:0;">
                Contact me at: sewlie.art@gmail.com
            </p>
        </div>
    </div>

    <script>
        function showContactPreview() {
            const contactPreview = document.getElementById('contact-preview');
            const content = contactPreview.querySelector('.contact-preview');
            contactPreview.style.display = 'flex';
            setTimeout(() => {
                content.style.opacity = 1;
            }, 0);
        }

        function hideContactPreview(event) {
            const contactPreview = document.getElementById('contact-preview');
            const content = contactPreview.querySelector('.contact-preview');

            if (event.target === contactPreview) {
                content.style.opacity = 0;
                setTimeout(() => {
                    contactPreview.style.display = 'none';
                }, 150);
            }
        }
    </script>

</body>
</html>
