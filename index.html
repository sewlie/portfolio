<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sewlie</title>

    <link rel="stylesheet" href="/stylesheets/style.css">
    <link rel="stylesheet" href="/stylesheets/navbar.css">

    <style>
        body {
            margin: 0;
            background: #ffffff;
            color: #000000;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* =========================
           NAV (UNCHANGED / ISOLATED)
        ========================== */
        nav.menu {
            background: transparent;
            position: relative;
            z-index: 10;
        }

        nav.menu a {
            color: #000;
            text-decoration: none;
        }

        /* =========================
           PAGE STAGE (BACKGROUND LAYER)
        ========================== */
        .page-stage {
            position: relative;
            min-height: calc(100vh - 80px);
            overflow: hidden;
        }

        /* DEFAULT BACKGROUND = DESIGN */
        .page-stage::before {
            content: "";
            position: absolute;
            inset: 0;

            background-image:
                linear-gradient(
                    90deg,
                    rgba(0, 0, 0, 0.85) 0%,
                    rgba(0, 0, 0, 0.55) 55%,
                    rgba(0,0,0,0.9) 100%
                ),
                url("./assets/Artboard 5.png");

            background-size: cover;
            background-position: center;
            opacity: 1;
            transform: scale(1.03);
            transition: opacity 0.5s ease, transform 0.5s ease;
            z-index: 0;
        }

        /* PHOTOGRAPHY HOVER OVERRIDE */
        .page-stage:has(.entry-block.photography:hover)::before {
            background-image:
                linear-gradient(
                    90deg,
                    rgba(0, 0, 0, 0.85) 0%,
                    rgba(0, 0, 0, 0.55) 75%,
                    rgba(0,0,0,0.9) 100%
                ),
                url("./assets/Purple Haze.jpg");

            transform: scale(1);
        }

        /* =========================
           CONTENT
        ========================== */
        .homepage-container {
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 0px;
            text-align: left;
            position: relative;
            z-index: 1;
        }

        .entry-block {
            cursor: pointer;
            padding: 90px 70px;
        }

        .entry-title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin-bottom: 10px;
            color: #ffffff;
            transition: opacity 0.25s ease;
        }

        .entry-block:hover .entry-title {
            opacity: 0.8;
        }

        .entry-description {
            font-size: 1rem;
            max-width: 520px;
            line-height: 1.4;
            color: #ffffff;
        }

        /* =========================
           MOBILE
        ========================== */
        @media (max-width: 600px) {
            .entry-block {
                padding: 60px 24px;
            }

            .entry-title {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

<body>

    <!-- NAV -->
    <nav class="menu">
        <div class="menu-left">
            <a href="/">sewlie</a>
        </div>

        <div class="menu-center">
            <a href="#" onclick="event.preventDefault(); showContactPreview()">contact</a>
        </div>
    </nav>

    <!-- BACKGROUND + CONTENT STAGE -->
    <div class="page-stage">

        <main class="homepage-container">

            <div class="entry-block design" onclick="window.location.href='/design'">
                <div class="entry-title">DESIGN</div>
                <div class="entry-description">
                    Visual systems, posters, physical objects, and digital work
                </div>
            </div>

            <div class="entry-block photography" onclick="window.location.href='/photography'">
                <div class="entry-title">PHOTOGRAPHY</div>
                <div class="entry-description">
                    Macro cannabis photography and close-range visual studies
                </div>
            </div>

        </main>

    </div>

    <!-- CONTACT OVERLAY -->
    <div class="preview-overlay" id="contact-preview" onclick="hideContactPreview(event)" style="
        display:none;
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        background:rgba(255,255,255,0.95);
        justify-content:center;
        align-items:center;
        z-index:20;
    ">
        <div class="contact-preview" style="
            border-radius:10px;
            padding:30px 40px;
            background:#fff;
            box-shadow:0 0 20px rgba(0,0,0,0.15);
            opacity:0;
            transition:opacity 0.2s ease;
        ">
            <p style="font-weight:700; margin:0;">
                Contact me at: sewlie.art@gmail.com
            </p>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script>
        function showContactPreview() {
            const contactPreview = document.getElementById('contact-preview');
            const content = contactPreview.querySelector('.contact-preview');
            contactPreview.style.display = 'flex';
            setTimeout(() => {
                content.style.opacity = 1;
            }, 0);
        }

        function hideContactPreview(event) {
            const contactPreview = document.getElementById('contact-preview');
            const content = contactPreview.querySelector('.contact-preview');

            if (event.target === contactPreview) {
                content.style.opacity = 0;
                setTimeout(() => {
                    contactPreview.style.display = 'none';
                }, 150);
            }
        }
    </script>

</body>
</html>
